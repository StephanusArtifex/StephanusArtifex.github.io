<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123D32" />
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />
  {{OG_IMAGE}}
  <link rel="canonical" href="{{CANONICAL_URL}}" />
  <link rel="alternate" type="application/rss+xml" title="Steve Muganda Notes" href="/notes/feed.xml" />
  <title>{{TITLE}} | Steve Muganda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <link href="../../assets/css/styles.css" rel="stylesheet" />
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="../../"><img alt="" src="../../assets/media/site/monogram.svg" /><span>Steve Muganda</span></a>
    <button aria-expanded="false" aria-label="Open navigation" class="nav-toggle" data-nav-toggle><span></span></button>
    <nav class="site-nav" data-nav aria-label="Primary navigation">
      <a href="../../">Home</a><a href="../../work/">Work</a><a href="../../about/">About</a><a aria-current="page" href="../">Notes</a><a href="/contact/">Contact</a>
    </nav>
  </div>
</header>
<main class="container page" id="main">
  <article class="note-article">
    <header class="note-article-header">
      <p class="eyebrow note-article-category">{{CATEGORY}}</p>
      <h1>{{TITLE}}</h1>
      <p class="note-article-deck">{{DESCRIPTION}}</p>
      <div class="note-article-meta"><time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time><span aria-hidden="true">·</span><span>{{READING_TIME}}</span></div>
    </header>
    {{HERO_IMAGE}}
    <div class="note-body">
      {{BODY}}
    </div>
    <footer class="note-end">
      <span aria-hidden="true">✦</span>
      <a class="text-link editorial-link" href="../">Back to Notes →</a>
    </footer>
  </article>
</main>
<footer class="contact-footer" id="contact">
  <div class="container contact-inner">
    <div class="contact-links"><a href="https://github.com/StephanusArtifex" rel="noreferrer" target="_blank">GitHub ↗</a><span class="contact-pending" title="Add public LinkedIn URL before launch">LinkedIn</span><span class="contact-pending" title="Add public email address before launch">Email</span></div>
    <div class="contact-modes">Employment · Freelance · Collaboration</div>
  </div>
</footer>
<script defer src="../../assets/js/site.js"></script>
</body>
</html>
